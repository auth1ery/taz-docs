name: notify site

on:
  push:
    branches: [staging]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tazldied/tazbotsite/dispatches \
            -d '{"event_type":"docs-updated","client_payload":{"sha":"${{ github.sha }}"}}'
